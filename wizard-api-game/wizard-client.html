<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard API Game — Derek Carttar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; font-family: 'Source Sans 3', sans-serif; background: #1F2937; color: #E7E2D8; overflow-x: hidden; }
  body, p, div, span, li, td, th { word-break: normal; overflow-wrap: break-word; }
  a { color: #E3A857; }
  a:hover { color: #F0C078; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: clamp(16px, 5vw, 32px); }
  .wrap-wide { max-width: 1000px; }
  h1, h2, h3 { font-family: 'Source Sans 3', sans-serif; margin: 0; }
  nav.top-nav { position: sticky; top: 0; background: #1B222E; border-bottom: 1px solid #384156; z-index: 30; }
  nav.top-nav .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: clamp(12px, 3vw, 18px) clamp(16px, 5vw, 24px); max-width: 1280px; gap: 12px; }
  nav.top-nav a { text-decoration: none; font-weight: 600; font-size: clamp(13px, 2vw, 15px); }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #E3A857; margin-bottom: 6px; }
  .card { background: #262F3F; border: 1px solid #384156; border-radius: 12px; padding: clamp(16px, 4vw, 24px); margin-bottom: 20px; }
  .btn { background: #B45309; color: #FAF8F5; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; margin: 4px 6px 4px 0; }
  .btn:hover { background: #8A3E09; }
  .btn:disabled { background: #4B5563; cursor: not-allowed; }
  .btn-outline { background: transparent; color: #E7E2D8; border: 1px solid #4B5563; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; margin: 4px 6px 4px 0; }
  .btn-small { padding: 6px 12px; font-size: 13px; }
  input[type=text] { font-family: inherit; background: #1B222E; border: 1px solid #4B5563; color: #E7E2D8; padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; margin-bottom: 8px; }
  label { font-size: 13px; color: #A8A29E; display: block; margin-bottom: 4px; }
  .muted { color: #A8A29E; font-size: 14px; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .msg-error { background: #4A1F24; color: #F3B4B4; }
  .msg-info { background: #1F3A3A; color: #A6E3D4; }
  .spell-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #384156; flex-wrap: wrap; }
  .spell-row:last-child { border-bottom: none; }
  .spell-name { font-weight: 700; }
  .spell-desc { font-size: 13px; color: #A8A29E; margin-top: 2px; }
  .progress-bar { background: #1B222E; border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; width: 100%; }
  .progress-fill { background: #E3A857; height: 100%; transition: width 0.4s ease; }
  .exit-list, .npc-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .log-entry { font-size: 13px; color: #A8A29E; padding: 4px 0; border-bottom: 1px solid #2E3648; }
  header.top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .stat-pill { background: #1B222E; border-radius: 999px; padding: 6px 14px; font-size: 13px; }
